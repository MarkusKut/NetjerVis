  output-dir: docs
  pre-render: scripts/build_site.R
  resources:
    - www/**
    - .nojekyll

website:
  title: "NetjerVis"
  search: true
  navbar:
    left:
      - text: Startseite
        href: index.qmd
      - text: Datenbank
        href: datenbank.qmd
      - text: Figurenkatalog
        href: katalog.qmd
      - text: Objektkatalog
        href: objekte/index.qmd
      - text: Vergleiche
        href: vergleiche.qmd
